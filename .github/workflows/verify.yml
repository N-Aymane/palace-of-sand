name: Verify and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: node --test scripts/test-checkpoint.mjs
      - run: cargo test --locked --lib --tests
      - run: cargo clippy --locked --lib -- -D warnings
  verify:
    needs: simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - run: cargo clippy --locked --target wasm32-unknown-unknown --features renderer -- -D warnings
      - id: build
        run: node scripts/build.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.build.outcome == 'success'
        with:
          name: palace-of-sand-web
          path: dist/
          if-no-files-found: error
  browsers:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [desktop-chromium, portrait-chromium, mobile-chromium, mobile-webkit, portrait-webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: palace-of-sand-web
          path: dist/
      - name: Browser verification
        env:
          TEST_SCENARIOS: ${{ matrix.scenario }}
        run: |
          npm ci
          if [[ "$TEST_SCENARIOS" == *webkit ]]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install --with-deps chromium
          fi
          npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-verification-${{ matrix.scenario }}
          path: test-results/
